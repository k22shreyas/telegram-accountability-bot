name: Send Nudge

on:
  schedule:
    # Each line fires the workflow near a rough window; the Go program
    # itself adds a random 0-45 min delay on top, so actual send times
    # land unpredictably within each window rather than on the dot.
    - cron: "30 15 * * *"   # ~11:00am ET window
    - cron: "0 19 * * *"    # ~3:00pm ET window
    - cron: "0 23 * * *"    # ~7:00pm ET window
  workflow_dispatch: {}      # lets you trigger a test run manually from the Actions tab

permissions:
  contents: write           # needed so the workflow can commit state.json back

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run nudge bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: go run main.go

      - name: Commit updated state
        run: |
          git config user.name "nudge-bot"
          git config user.email "nudge-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git push
